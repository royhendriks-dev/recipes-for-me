name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube heeft de volledige historie nodig
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
      - name: SonarQube Cloud
        # Secrets zijn niet beschikbaar voor PR's vanaf forks (bijv. Dependabot); sla de scan dan over.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Op een push naar develop geeft SonarQube Cloud (gratis plan) de gate-status van een niet-main-branch niet vrij;
          # wachten op de gate faalt dan. PR's en main blijven wachten.
          args: ${{ (github.event_name == 'push' && github.ref_name == 'develop') && '-Dsonar.verbose=false' || '-Dsonar.qualitygate.wait=true' }}
