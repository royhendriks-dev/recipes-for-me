name: Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: # gestart door release.yml op een tag
  pull_request:
    paths: [Dockerfile, docker/**, package*.json, src/**, public/**, angular.json, tsconfig*.json]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/royhendriks-dev/recipes-for-me

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Inloggen bij GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      # Op een tag v1.2.3 wordt de versie 1.2.3, anders dev; de commit is altijd de volledige sha.
      - id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=dev" >> "$GITHUB_OUTPUT"; fi
      # Op een PR wordt alleen gebouwd (beide architecturen), niet gepusht.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
